name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: amd64, goarm: "" }
          - { goarch: arm64, goarm: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/moureau-dev/menina/internal/version.Version=${VERSION} \
              -X github.com/moureau-dev/menina/internal/version.Commit=${COMMIT} \
              -X github.com/moureau-dev/menina/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/menina-linux-${{ matrix.goarch }} ./cmd/menina
      - uses: actions/upload-artifact@v4
        with:
          name: menina-linux-${{ matrix.goarch }}
          path: dist/menina-linux-${{ matrix.goarch }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum menina-linux-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/menina-linux-*
            dist/checksums.txt
