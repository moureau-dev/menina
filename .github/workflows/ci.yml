name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'llms.txt'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'examples/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'llms.txt'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'examples/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/menina ./cmd/menina
      - name: build client (all platforms)
        run: |
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -o "bin/menina-client-${target%/*}-${target#*/}" ./cmd/menina-client
          done
