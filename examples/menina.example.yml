project: demo
environment: production

defaults:
  context: .
  tag: production            # default tag; matches defaults.imageTagStrategy
  build: true                # hint only; Menina itself does not build

storages:
  pgdata:
    size: 1Gi
    path: /var/lib/postgresql/data
    access: single-write

  sqlite:
    size: 1Gi
    path:  /var/lib/sqlite/data
    access: single-write

apps:
  api:
    dockerfile: apps/api/Dockerfile
    port: 8080
    host: api.example.com
    env: { REDIS_URL: "redis://redis:6379" } # environment variables merged in the container
    secrets: [DATABASE_URL]  # names only, values stay on the host
    storage: [sqlite] # list of storage names, or a single name, or an object with the name and overrides ({ name: sqlite, path: /data }) or list of such objects
    replicas: 1 # optional, defaults to 1. can be a single number or an object with min and max values

  web:
    dockerfile: apps/web/Dockerfile
    port: 3000
    host: demo.example.com

  redis:
    image: redis:7-alpine    # external image = plain app, no build
    port: 6379
    storage: { size: 512Mi, path: /data }

  pg:
    image: postgres:15-alpine
    port: 5432
    env: { POSTGRES_PASSWORD: secret }
    storage: [pgdata]

workers:
  jobs:
    from: api
    command: ["/app/worker"]
    replicas: 2
    env: { QUEUE: default }

  report:
    dockerfile: apps/report/Dockerfile   # own image
    replicas: { min: 2, max: 5 }
    env: { 
      DATABASE_URL: "postgres://postgres:secret@pg:5432/postgres",
      REPORT_PATH: "/var/reports",
    }
