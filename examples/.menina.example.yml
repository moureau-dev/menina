# yaml-language-server: $schema=https://menina.moureau.dev/schema/menina.schema.json
version: 1
project: demo
environment: production

# Config environment menina client variables.
# They are only available in this configuration file and are not passed to
# the container automatically. Use the values by wrapping with `${}`.
vars:
  ENVIRONMENT: production
  DOMAIN: example.com
  MOUNT_BASE: /var/lib
  

# Default values for apps and workers.
defaults:
  context: .
  tag: ${ENVIRONMENT}            # default tag; matches defaults.imageTagStrategy
  registry: registry.example.com # used by the client to derive built image repositories

# Persistent storage definitions.
# Each storage has a name, size, path, and access mode.
# The path is the mount point inside the container.
# single-writer (the default) keeps replica count at 1. multi-writer needs a
# ReadWriteMany storage class, which Menina does not configure yet.
storages:
  pgdata:
    size: 2Gi
    path: ${MOUNT_BASE}/postgresql/data
    access: single-writer

  sqlite:
    size: 1Gi
    path:  ${MOUNT_BASE}/sqlite/data

  jobsdata:
    size: 1Gi
    path: ${MOUNT_BASE}/jobs/data

  reports:
    size: 1Gi
    path: ${MOUNT_BASE}/reports
    access: single-writer

# Application definitions.
# Each app has a dockerfile or an image, a port, and optional environment variables,
# secrets, storage, and replicas.
apps:
  api:
    dockerfile: apps/api/Dockerfile
    port: 8080
    host: api.${DOMAIN}
    env: { REDIS_URL: "redis://redis:6379", DB_PATH: "${MOUNT_BASE}/sqlite/data" } # environment variables merged in the container
    storage: [sqlite] # list of storage names, or a single name, or an object with the name and overrides ({ use: sqlite, path: /data }) or list of such objects
    replicas: 1 # optional, defaults to 1. can be a single number or an object with min and max values

  web:
    dockerfile: apps/web/Dockerfile
    port: 3000
    host: demo.${DOMAIN}

  redis:
    image: redis:7-alpine    # external image = plain app, no build
    port: 6379
    storage: { size: 512Mi, path: /data }

  pg:
    image: postgres:15-alpine
    port: 5432
    env: { POSTGRES_DB: demo, POSTGRES_USER: demo }   # non-sensitive
    secrets: [POSTGRES_PASSWORD]                      # value lives on the host
    storage: pgdata

# Worker definitions.
# Each worker has a command, optional environment variables, secrets, storage, and replicas.
workers:
  jobs:
    from: api
    command: ["/app/worker"]
    replicas: 1
    storage: [jobsdata]               # workers do not inherit storage from `from`
    env: { QUEUE: default, DB_PATH: "${MOUNT_BASE}/jobs/data" }

  report:
    dockerfile: apps/report/Dockerfile   # own image
    replicas: 1                          # reports is single-writer
    storage: [reports]
    secrets: [DATABASE_URL]
    env: { 
      REPORT_PATH: "${MOUNT_BASE}/reports",
    }
